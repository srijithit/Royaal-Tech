<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Definitions for gradients and patterns -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f1a" />
      <stop offset="40%" stop-color="#0e1d32" />
      <stop offset="100%" stop-color="#080f1a" />
    </linearGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c7030" />
      <stop offset="50%" stop-color="#c8a94a" />
      <stop offset="100%" stop-color="#e2c97e" />
    </linearGradient>

    <!-- Gold Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Quilted Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 48 M 0 0 L 48 48" fill="none" stroke="#c8a94a" stroke-width="1" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)" />
  
  <!-- Grid Overlay -->
  <rect width="900" height="600" fill="url(#grid)" />
  
  <!-- Subtle ambient light from top-right -->
  <circle cx="750" cy="150" r="300" fill="#c8a94a" fill-opacity="0.04" filter="blur(40px)" />
  
  <!-- Decorative Abstract Coated Plates / Industrial Mockup Shapes -->
  <g transform="translate(480, 200) rotate(-15)">
    <!-- Plate 1 -->
    <rect x="0" y="0" width="280" height="180" rx="12" fill="#13213a" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />
    <!-- Coat pattern on Plate 1 -->
    <rect x="15" y="15" width="250" height="150" rx="8" fill="url(#bgGrad)" />
    <path d="M 30 50 L 250 50 M 30 100 L 250 100" stroke="#c8a94a" stroke-width="1" stroke-opacity="0.1" />
  </g>
  
  <g transform="translate(540, 260) rotate(-15)">
    <!-- Plate 2 (Foreground, Golden coated finish look) -->
    <rect x="0" y="0" width="280" height="180" rx="12" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))" />
    <!-- Inner gold frame -->
    <rect x="10" y="10" width="260" height="160" rx="8" fill="none" stroke="#c8a94a" stroke-width="1" stroke-opacity="0.3" />
    <!-- Industrial slots -->
    <rect x="30" y="30" width="40" height="120" rx="4" fill="#080f1a" fill-opacity="0.6" />
    <rect x="90" y="30" width="40" height="120" rx="4" fill="#080f1a" fill-opacity="0.6" />
    <rect x="150" y="30" width="40" height="120" rx="4" fill="#080f1a" fill-opacity="0.6" />
    <rect x="210" y="30" width="40" height="120" rx="4" fill="#080f1a" fill-opacity="0.6" />
  </g>

  <!-- Left Side content (Mock Hero Text / UI) -->
  <g transform="translate(80, 0)">
    <!-- Brand / Eyebrow -->
    <g transform="translate(0, 180)">
      <line x1="0" y1="-5" x2="36" y2="-5" stroke="#c8a94a" stroke-width="1.5" />
      <text x="48" y="0" font-family="'Jost', sans-serif" font-size="12" font-weight="600" fill="#c8a94a" letter-spacing="4" text-transform="uppercase">ESTABLISHED 2012</text>
    </g>
    
    <!-- Heading / Title -->
    <text x="0" y="260" font-family="'Cormorant Garamond', serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Royaal Coats</text>
    <text x="0" y="320" font-family="'Cormorant Garamond', serif" font-size="44" font-style="italic" font-weight="600" fill="#c8a94a">Powder Coating</text>
    
    <!-- Subtitle / Description -->
    <text x="0" y="370" font-family="'Jost', sans-serif" font-size="15" font-weight="300" fill="#ddd5c4" fill-opacity="0.7">Premium industrial surface finishing</text>
    <text x="0" y="395" font-family="'Jost', sans-serif" font-size="15" font-weight="300" fill="#ddd5c4" fill-opacity="0.7">&amp; display rack manufacturer.</text>
    
    <!-- CTA Button Mock -->
    <g transform="translate(0, 440)">
      <rect width="180" height="48" fill="#c8a94a" rx="2" />
      <text x="90" y="28" font-family="'Jost', sans-serif" font-size="12" font-weight="600" fill="#080f1a" letter-spacing="2" text-anchor="middle">GET A QUOTE</text>
    </g>
  </g>

  <!-- Top-Right Brand Logo watermark -->
  <g transform="translate(800, 70)">
    <polygon points="0,-25 22,0 0,25 -22,0" fill="none" stroke="#c8a94a" stroke-width="1.5" stroke-opacity="0.5" filter="url(#glow)" />
    <polygon points="0,-18 16,0 0,18 -16,0" fill="none" stroke="#c8a94a" stroke-width="1" stroke-opacity="0.2" />
    <text x="0" y="5" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="700" fill="#c8a94a" text-anchor="middle">RC</text>
  </g>
</svg>
